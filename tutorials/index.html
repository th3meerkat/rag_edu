<style>
  :root {
    --bg: #fafaf7;
    --bg-card: #ffffff;
    --text: #1d1d1f;
    --text-muted: #57606a;
    --accent: #2b5e3a;
    --accent-soft: #e8f0ea;
    --border: #e6e6df;
    --func: #8250df;
    --shadow: 0 1px 3px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.65;
  }
  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 80px 28px 96px;
  }
  header.hero {
    text-align: center;
    margin-bottom: 56px;
  }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 46px;
    line-height: 1.1;
    margin: 0 0 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .subtitle {
    font-size: 19px;
    color: var(--text-muted);
    max-width: 680px;
    margin: 0 auto 36px;
  }
  .hero-img {
    max-width: 360px;
    width: 100%;
    height: auto;
    margin: 0 auto;
    display: block;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(43, 94, 58, 0.12);
  }

  h2 {
    font-size: 26px;
    margin: 0 0 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
    margin: 0 0 56px;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 22px 24px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--bg-card);
    text-decoration: none;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(43, 94, 58, 0.12);
    border-color: var(--accent);
  }
  .card .card-eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
  }
  .card h3 {
    font-size: 19px;
    margin: 0;
    font-weight: 700;
  }
  .card p {
    font-size: 14.5px;
    color: var(--text-muted);
    margin: 0;
    line-height: 1.5;
  }
  .card .card-cta {
    margin-top: auto;
    padding-top: 6px;
    color: var(--accent);
    font-weight: 600;
    font-size: 14px;
  }
  .card .card-cta::after { content: " →"; }

  .pitch {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 32px;
    margin-bottom: 48px;
  }
  .pitch p { margin: 0 0 12px; }
  .pitch p:last-child { margin: 0; }
  .pitch strong { color: var(--accent); }

  footer {
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }
  footer .footer-meta {
    margin-top: 8px;
    font-size: 12px;
    opacity: 0.85;
  }
  footer .footer-meta a {
    color: var(--text-muted);
    text-decoration: none;
    border-bottom: 1px dotted var(--text-muted);
  }
  footer .footer-meta a:hover { color: var(--accent); border-bottom-color: var(--accent); }

  /* ======= Language toggle (same as tutorials) ====================== */
  .lang-toggle {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 1200;
    display: inline-flex;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    font-size: 12px;
    font-weight: 600;
    user-select: none;
  }
  .lang-toggle button {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
    font: inherit;
    font-size: 18px;
    line-height: 1;
    filter: grayscale(0.7);
    opacity: 0.55;
    transition: background 0.15s ease, filter 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
  }
  .lang-toggle button:hover { filter: grayscale(0.2); opacity: 0.85; }
  body.lang-en .lang-toggle button[data-lang="en"],
  body.lang-es .lang-toggle button[data-lang="es"] {
    background: var(--accent-soft);
    filter: grayscale(0);
    opacity: 1;
    transform: scale(1.05);
  }
  @media (max-width: 720px) {
    .lang-toggle button { padding: 8px 14px; min-height: 36px; }
  }

  @media (max-width: 720px) {
    .container { padding: 48px 20px 56px; }
    h1 { font-size: 34px; }
    .hero-img { max-width: 240px; }
  }

  @media print {
    .lang-toggle { display: none !important; }
    body { font-size: 12pt; }
    .container { max-width: none; padding: 0; }
    .card { break-inside: avoid; }
  }
</style>

<script src="i18n.js"></script>
<script>
(function () {
  const TITLES = {
    en: 'RAG Lab · Tutorials by reading a real production RAG',
    es: 'RAG Lab · Tutoriales leyendo un RAG real de producción'
  };
  function setLang(lang) {
    if (lang !== 'en' && lang !== 'es') lang = 'en';
    document.body.classList.remove('lang-en', 'lang-es');
    document.body.classList.add('lang-' + lang);
    document.documentElement.setAttribute('lang', lang);
    if (TITLES[lang]) document.title = TITLES[lang];
    if (window.i18n) window.i18n.setLang(lang);
    try { localStorage.setItem('tutorial_lang', lang); } catch (e) {}
  }
  let initialLang = 'en';
  try {
    const stored = localStorage.getItem('tutorial_lang');
    if (stored === 'en' || stored === 'es') initialLang = stored;
  } catch (e) {}
  setLang(initialLang);
  if (window.i18n) window.i18n.init('i18n/index.json', initialLang);

  document.querySelectorAll('.lang-toggle button[data-lang]').forEach(function (btn) {
    btn.addEventListener('click', function () { setLang(btn.getAttribute('data-lang')); });
  });
})();
</script>
