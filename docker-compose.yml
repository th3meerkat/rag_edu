services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: rag_chat_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE

  reranker:
    image: michaelf34/infinity:latest
    container_name: rag_chat_reranker
    restart: unless-stopped
    ports:
      - "8002:7997"
    volumes:
      - ./reranker_cache:/app/.cache
    command: >-
      v2
      --model-id Alibaba-NLP/gte-multilingual-reranker-base
      --port 7997
